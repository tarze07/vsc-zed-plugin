<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" font-family="system-ui, sans-serif" font-size="10">
  <title>Agent Changes view: files changed by a session and a multi-diff with accept and reject actions</title>
  <rect width="480" height="240" rx="10" fill="#1c1f24"/>
  <rect x="1" y="1" width="478" height="238" rx="10" fill="none" stroke="#2e333b"/>
  <rect x="12" y="12" width="176" height="216" rx="6" fill="#22262c"/>
  <text x="24" y="32" fill="#959dab" font-size="8" letter-spacing=".5">AGENT CHANGES · 3 FILES</text>
  <circle cx="28" cy="52" r="4" fill="#c678dd"/><text x="38" y="55" fill="#e6e9ee">Claude Code</text><text x="176" y="55" fill="#959dab" text-anchor="end">✓✓ ↶</text>
  <text x="38" y="68" fill="#959dab" font-size="8">3 files · vs main</text>
  <text x="38" y="88" fill="#d7b46a">M</text><text x="52" y="88" fill="#cdd2da">agents.ts</text><text x="176" y="88" fill="#959dab" text-anchor="end">✓ ↶</text>
  <text x="38" y="106" fill="#8cc265">A</text><text x="52" y="106" fill="#cdd2da">status.ts</text>
  <text x="38" y="124" fill="#e06c75">D</text><text x="52" y="124" fill="#cdd2da">legacy.ts</text>
  <!-- diff -->
  <rect x="200" y="12" width="268" height="216" rx="6" fill="#22262c"/>
  <text x="212" y="32" fill="#e6e9ee">Claude Code ↔ main</text>
  <g font-family="ui-monospace, monospace" font-size="9">
    <text x="212" y="56" fill="#959dab">agents.ts</text>
    <rect x="200" y="64" width="268" height="14" fill="#e06c75" opacity=".18"/><text x="212" y="74" fill="#cdd2da">- const timeout = 1000;</text>
    <rect x="200" y="78" width="268" height="14" fill="#8cc265" opacity=".18"/><text x="212" y="88" fill="#cdd2da">+ const timeout = waitAfter();</text>
    <text x="212" y="116" fill="#959dab">status.ts</text>
    <rect x="200" y="124" width="268" height="14" fill="#8cc265" opacity=".18"/><text x="212" y="134" fill="#cdd2da">+ export type Status =</text>
    <rect x="200" y="138" width="268" height="14" fill="#8cc265" opacity=".18"/><text x="212" y="148" fill="#cdd2da">+   'running' | 'waiting';</text>
  </g>
  <rect x="300" y="196" width="76" height="18" rx="3" fill="#2f63b8"/><text x="338" y="208" fill="#ffffff" text-anchor="middle">Accept All</text>
  <rect x="384" y="196" width="72" height="18" rx="3" fill="#2a2f37" stroke="#2e333b"/><text x="420" y="208" fill="#cdd2da" text-anchor="middle">Merge</text>
</svg>
