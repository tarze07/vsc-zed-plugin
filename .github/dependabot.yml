version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Must match the minimum supported VS Code (engines.vscode ^1.95.0); newer typings
      # would allow APIs that older VS Code versions do not have.
      - dependency-name: '@types/vscode'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Must match the Node.js version used by the project (Node 22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # ESLint packages must be upgraded together.
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
